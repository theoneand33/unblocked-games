name: opencode-review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run opencode
        uses: anomalyco/opencode-action@latest
        with:
          model: openrouter/deepseek/deepseek-v4-flash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Post review comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let raw;
            try {
              raw = fs.readFileSync('opencode-results.json', 'utf8');
            } catch {
              raw = '{"note":"action did not produce file"}';
            }
            const body = `## Opencode Review\n\n\`\`\`json\n${raw.slice(0, 60000)}\n${raw.length > 60000 ? '\n... (truncated)' : ''}\n\`\`\``;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.number }},
              body
            });
